  <main>
    <div>
      <h1>Contact</h1>
      <form>

        <div><label for="reason">Reason: </label><select name="reason" id="reason" size="1">
          <option value="Interest" selected>Express interest</option>
          <option value="Suggest">Suggest a change</option>
          <option value="Report">Report bug or incorrect information</option>
          <option value="Other">Other</option>
        </select></div>

        <div><label for="Title">Title: </label><input type="text" name="Title" id="Title"></div>
        <textarea name="Message" id="Message" rows="10">
Hey Caleb,

I'm reaching out because ...
        </textarea>

        <h3>What page are you talking about?</h3>
        <div><input type="radio" name="which" id="Home"><label for="Home">The homepage</label></div>
        <div><input type="radio" name="which" id="Details"><label for="Details">The bear details page</label></div>
        <div><input type="radio" name="which" id="Contact"><label for="Contact">This page: the contact page</label></div>
        <div><input type="radio" name="which" id="Credits"><label for="Credits">The credits page</label></div>

        <div>
          <input type="checkbox" name="checkbox" id="checkbox"><label for="checkbox">Include a date</label>
        </div>

        <div class="date">
          <label for="date">Enter date: </label><input type="date" name="date" id="date">
        </div>

        <div>
          <input type="Reset" value="Reset">
          <input type="Submit" value="Submit">
        </div>

      </form>
    </div>
  </main>
